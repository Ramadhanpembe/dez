[project]
name = "streaming"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apache-flink==2.3.0",
    "kafka-python>=3.0.12",
    "nbconvert>=7.17.2",
    "pandas>=1.3.0",
    "polars>=2.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow<21.0.0",
]

[project.scripts]
streaming = "streaming:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
apache-beam = ["setuptools<81"]
