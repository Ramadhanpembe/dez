[project]
name = "streaming"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kafka-python>=3.0.12",
    "nbconvert>=7.17.2",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
]

[project.scripts]
